<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="300" height="300" fill="#14640D"/>

  <!-- ЛИНИИ (отдельные элементы) -->
  <g id="connections" stroke="white" stroke-width="1.5" opacity="0.8">
    <line id="line-A-B" x1="151" y1="266" x2="22" y2="160" />
    <line id="line-A-C" x1="151" y1="266" x2="93" y2="175" />
    <line id="line-C-D" x1="93" y1="175" x2="37" y2="102" />

    <line id="line-A-E" x1="151" y1="266" x2="100" y2="102" />
    <line id="line-A-F" x1="151" y1="266" x2="161" y2="178" />
    <line id="line-F-G" x1="161" y1="178" x2="143" y2="115" />
    <line id="line-G-H" x1="143" y1="115" x2="147" y2="60" />
    <line id="line-H-I" x1="147" y1="60" x2="120" y2="43" />

    <line id="line-A-L" x1="151" y1="266" x2="239" y2="206" />
    <line id="line-A-J" x1="151" y1="266" x2="237" y2="160" />
    <line id="line-J-K" x1="237" y1="160" x2="259" y2="115" />
  </g>

  <!-- КРУГИ -->
  <g id="circles" fill="#0C9E16">
