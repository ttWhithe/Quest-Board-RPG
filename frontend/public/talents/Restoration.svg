    <text x="93" y="175">C</text>
    <text x="37" y="102">D</text>
    <text x="100" y="102">E</text>
    <text x="161" y="178">F</text>
    <text x="143" y="115">G</text>
    <text x="147" y="60">H</text>
    <text x="120" y="43">I</text>
    <text x="237" y="160">J</text>
    <text x="259" y="115">K</text>
    <text x="239" y="206">L</text>
