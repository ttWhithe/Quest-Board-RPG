    <circle id="circle-B" cx="22" cy="160" r="10" />
    <circle id="circle-C" cx="93" cy="175" r="10" />
    <circle id="circle-D" cx="37" cy="102" r="10" />
    <circle id="circle-E" cx="100" cy="102" r="10" />
    <circle id="circle-F" cx="161" cy="178" r="10" />
    <circle id="circle-G" cx="143" cy="115" r="10" />
    <circle id="circle-H" cx="147" cy="60" r="10" />
    <circle id="circle-I" cx="120" cy="43" r="10" />
    <circle id="circle-J" cx="237" cy="160" r="10" />
    <circle id="circle-K" cx="259" cy="115" r="10" />
    <circle id="circle-L" cx="239" cy="206" r="10" />
