<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="300" height="300" fill="#14640D"/>

  <!-- ЛИНИИ (отдельные элементы) -->
  <g id="connections" stroke="white" stroke-width="1.5" opacity="0.8">
    <line id="line-A-B" x1="172" y1="271" x2="148" y2="176" />
    <line id="line-B-C" x1="148" y1="176" x2="96" y2="100" />
    <line id="line-C-D" x1="96" y1="100" x2="106" y2="51" />
    <line id="line-D-E" x1="106" y1="51" x2="148" y2="18" />
    <line id="line-E-F" x1="148" y1="18" x2="184" y2="35" />
    <line id="line-B-F" x1="148" y1="176" x2="184" y2="35" />
  </g>

  <!-- КРУГИ -->
  <g id="circles" fill="#0C9E16">
    <circle id="circle-A" cx="172" cy="271" r="10" />
    <circle id="circle-B" cx="148" cy="176" r="10" />
    <circle id="circle-C" cx="96" cy="100" r="10" />
    <circle id="circle-D" cx="106" cy="51" r="10" />
    <circle id="circle-E" cx="148" cy="18" r="10" />
    <circle id="circle-F" cx="184" cy="35" r="10" />
  </g>

  <!-- ТЕКСТ (Подписи в центрах кругов) -->
  <g id="labels" fill="white" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="172" y="271">A</text>
    <text x="148" y="176">B</text>
    <text x="96" y="100">C</text>
    <text x="106" y="51">D</text>
    <text x="148" y="18">E</text>
    <text x="184" y="35">F</text>
  </g>
</svg>
