    <circle id="circle-B" cx="58" cy="164" r="10" />
    <circle id="circle-C" cx="48" cy="75" r="10" />
    <circle id="circle-D" cx="52" cy="35" r="10" />
    <circle id="circle-E" cx="105" cy="15" r="10" />
    <circle id="circle-F" cx="115" cy="187" r="10" />
    <circle id="circle-G" cx="99" cy="75" r="10" />
