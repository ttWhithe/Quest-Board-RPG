<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="300" height="300" fill="#14640D"/>

  <!-- ЛИНИИ (отдельные элементы) -->
  <g id="connections" stroke="white" stroke-width="1.5" opacity="0.8">
    <line id="line-A-B" x1="130" y1="267" x2="52" y2="187" />
    <line id="line-B-C" x1="52" y1="187" x2="83" y2="104" />
    <line id="line-C-D" x1="83" y1="104" x2="118" y2="75" />
    <line id="line-D-E" x1="118" y1="75" x2="160" y2="35" />
    <line id="line-E-F" x1="160" y1="35" x2="228" y2="23" />

    <line id="line-A-G" x1="130" y1="267" x2="192" y2="187" />
    <line id="line-G-H" x1="192" y1="187" x2="200" y2="106" />
    <line id="line-H-I" x1="200" y1="106" x2="170" y2="90" />
  </g>

  <!-- КРУГИ -->
  <g id="circles" fill="#0C9E16">
    <circle id="circle-A" cx="130" cy="267" r="10" />
    <circle id="circle-B" cx="52" cy="187" r="10" />
    <circle id="circle-C" cx="83" cy="104" r="10" />
    <circle id="circle-D" cx="118" cy="75" r="10" />
    <circle id="circle-E" cx="160" cy="35" r="10" />
    <circle id="circle-F" cx="228" cy="23" r="10" />
    <circle id="circle-G" cx="192" cy="187" r="10" />
    <circle id="circle-H" cx="200" cy="106" r="10" />
    <circle id="circle-I" cx="170" cy="90" r="10" />
  </g>

  <!-- ТЕКСТ (Подписи в центрах кругов) -->
  <g id="labels" fill="white" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="130" y="267">A</text>
    <text x="52" y="187">B</text>
    <text x="83" y="104">C</text>
    <text x="118" y="75">D</text>
    <text x="160" y="35">E</text>
    <text x="228" y="23">F</text>
    <text x="192" y="187">G</text>
    <text x="200" y="106">H</text>
    <text x="170" y="90">I</text>
  </g>
</svg>
