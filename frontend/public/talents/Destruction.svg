    <text x="60" y="172">B</text>
    <text x="52" y="116">C</text>
    <text x="104" y="151">D</text>
    <text x="98" y="86">E</text>
    <text x="138" y="150">F</text>
    <text x="138" y="72">G</text>
    <text x="179" y="191">H</text>
    <text x="173" y="116">I</text>
    <text x="191" y="72">J</text>
    <text x="189" y="15">K</text>
    <text x="211" y="152">L</text>
    <text x="208" y="238">M</text>
    <text x="228" y="191">N</text>
