    <line id="line-M-N" x1="208" y1="238" x2="228" y2="191" />
  </g>

  <!-- КРУГИ -->
  <g id="circles" fill="#0C9E16">
    <circle id="circle-A" cx="121" cy="265" r="10" />
    <circle id="circle-B" cx="60" cy="172" r="10" />
    <circle id="circle-C" cx="52" cy="116" r="10" />
    <circle id="circle-D" cx="104" cy="151" r="10" />
    <circle id="circle-E" cx="98" cy="86" r="10" />
    <circle id="circle-F" cx="138" cy="150" r="10" />
    <circle id="circle-G" cx="138" cy="72" r="10" />
    <circle id="circle-H" cx="179" cy="191" r="10" />
    <circle id="circle-I" cx="173" cy="116" r="10" />
    <circle id="circle-J" cx="191" cy="72" r="10" />
    <circle id="circle-K" cx="189" cy="15" r="10" />
