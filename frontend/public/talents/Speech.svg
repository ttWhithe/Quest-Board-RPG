<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="300" height="300" fill="#14640D"/>

  <!-- ЛИНИИ (отдельные элементы) -->
  <g id="connections" stroke="white" stroke-width="1.5" opacity="0.8">
    <line id="line-A-B" x1="75" y1="273" x2="98" y2="189" />
    <line id="line-B-C" x1="98" y1="189" x2="82" y2="105" />
    <line id="line-C-D" x1="82" y1="105" x2="68" y2="56" />
    <line id="line-D-E" x1="68" y1="56" x2="58" y2="27" />
    <line id="line-E-F" x1="58" y1="27" x2="161" y2="22" />

    <line id="line-A-G" x1="75" y1="273" x2="166" y2="189" />
    <line id="line-G-H" x1="166" y1="189" x2="202" y2="105" />
    <line id="line-H-I" x1="202" y1="105" x2="222" y2="56" />
  </g>

  <!-- КРУГИ -->
  <g id="circles" fill="#0C9E16">
    <circle id="circle-A" cx="75" cy="273" r="10" />
    <circle id="circle-B" cx="98" cy="189" r="10" />
    <circle id="circle-C" cx="82" cy="105" r="10" />
    <circle id="circle-D" cx="68" cy="56" r="10" />
    <circle id="circle-E" cx="58" cy="27" r="10" />
    <circle id="circle-F" cx="161" cy="22" r="10" />
    <circle id="circle-G" cx="166" cy="189" r="10" />
    <circle id="circle-H" cx="202" cy="105" r="10" />
    <circle id="circle-I" cx="222" cy="56" r="10" />
  </g>

  <!-- ТЕКСТ (Подписи в центрах кругов) -->
  <g id="labels" fill="white" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="75" y="273">A</text>
    <text x="98" y="189">B</text>
    <text x="82" y="105">C</text>
    <text x="68" y="56">D</text>
    <text x="58" y="27">E</text>
    <text x="161" y="22">F</text>
    <text x="166" y="189">G</text>
    <text x="202" y="105">H</text>
    <text x="222" y="56">I</text>
  </g>
</svg>
