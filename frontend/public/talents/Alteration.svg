<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="300" height="300" fill="#14640D"/>

  <!-- ЛИНИИ (отдельные элементы) -->
  <g id="connections" stroke="white" stroke-width="1.5" opacity="0.8">
    <line id="line-A-B" x1="119" y1="277" x2="75" y2="202" />
    <line id="line-A-C" x1="119" y1="277" x2="132" y2="178" />

    <line id="line-C-D" x1="132" y1="178" x2="79" y2="107" />
    <line id="line-C-E" x1="132" y1="178" x2="189" y2="107" />
    <line id="line-C-F" x1="132" y1="178" x2="132" y2="90" />

    <line id="line-F-G" x1="132" y1="90" x2="95" y2="53" />
    <line id="line-F-H" x1="132" y1="90" x2="160" y2="53" />

    <line id="line-H-I" x1="160" y1="53" x2="65" y2="23" />
    <line id="line-H-J" x1="160" y1="53" x2="216" y2="23" />
  </g>

  <!-- КРУГИ -->
  <g id="circles" fill="#0C9E16">
    <circle id="circle-A" cx="119" cy="277" r="10" />
    <circle id="circle-B" cx="75" cy="202" r="10" />
    <circle id="circle-C" cx="132" cy="178" r="10" />
    <circle id="circle-D" cx="79" cy="107" r="10" />
    <circle id="circle-E" cx="189" cy="107" r="10" />
    <circle id="circle-F" cx="132" cy="90" r="10" />
    <circle id="circle-G" cx="95" cy="53" r="10" />
    <circle id="circle-H" cx="160" cy="53" r="10" />
    <circle id="circle-I" cx="65" cy="23" r="10" />
    <circle id="circle-J" cx="216" cy="23" r="10" />
  </g>

  <!-- ТЕКСТ (Подписи в центрах кругов) -->
  <g id="labels" fill="white" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="119" y="277">A</text>
    <text x="75" y="202">B</text>
    <text x="132" y="178">C</text>
    <text x="79" y="107">D</text>
    <text x="189" y="107">E</text>
    <text x="132" y="90">F</text>
    <text x="95" y="53">G</text>
    <text x="160" y="53">H</text>
    <text x="65" y="23">I</text>
    <text x="216" y="23">J</text>
  </g>
</svg>
