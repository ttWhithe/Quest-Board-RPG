name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Поднимаем Postgres для тестов
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: questboard
          POSTGRES_PASSWORD: questboard
          POSTGRES_DB: questboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://questboard:questboard@localhost:5432/questboard
      JWT_SECRET: test_secret_key_that_is_long_enough_for_sha256
      REDIS_URL: redis://localhost:6379/0

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      working-directory: ./backend
      run: ruff check .

    - name: Type check with mypy
      working-directory: ./backend
      run: mypy app

    - name: Run migrations
      working-directory: ./backend
      run: alembic upgrade head

    - name: Test with pytest
      working-directory: ./backend
      run: pytest -q --cov=app --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build
      working-directory: ./frontend
      run: npm run build

    - name: Test
      working-directory: ./frontend
      run: npm test -- --run

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate Docker Compose
      run: docker compose build
